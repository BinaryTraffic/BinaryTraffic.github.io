<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>smkn apps</title>
  <meta name="description" content="smkn で作成したアプリの一覧">
  <style>
    :root {
      --bg: #f6f7fb; --card: #ffffff; --text: #1f2330; --muted: #6b7180;
      --accent: #3b6cf6; --border: #e3e6ee; --shadow: 0 2px 10px rgba(20, 30, 60, .06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12141a; --card: #1b1e27; --text: #e8eaf0; --muted: #9aa1b2;
        --accent: #7c9cff; --border: #2a2f3c; --shadow: 0 2px 10px rgba(0, 0, 0, .3);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
      line-height: 1.6;
    }
    header {
      padding: 48px 20px 24px; text-align: center;
      border-bottom: 1px solid var(--border);
    }
    header h1 { margin: 0; font-size: clamp(1.8rem, 5vw, 2.6rem); letter-spacing: .02em; }
    header p { margin: 8px 0 0; color: var(--muted); }
    .header-actions {
      display: flex; gap: 12px; justify-content: center; align-items: center;
      margin-top: 24px; flex-wrap: wrap;
    }
    .user-info {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 16px; background: var(--card);
      border: 1px solid var(--border); border-radius: 20px;
      font-size: 0.9rem;
    }
    .user-avatar {
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--accent); color: white;
      display: flex; align-items: center; justify-content: center;
      font-weight: 600; font-size: 0.85rem;
    }
    .btn {
      padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--card); color: var(--text); cursor: pointer;
      font-size: 0.9rem; text-decoration: none; display: inline-block;
      transition: all 0.15s ease;
    }
    .btn:hover {
      background: var(--bg); border-color: var(--accent);
    }
    .btn-primary {
      background: var(--accent); color: white; border-color: var(--accent);
    }
    .btn-primary:hover {
      opacity: 0.9; background: var(--accent);
    }
    main { max-width: 1080px; margin: 0 auto; padding: 32px 20px 48px; }
    .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
    .card {
      display: flex; flex-direction: column; gap: 8px; padding: 20px;
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      box-shadow: var(--shadow); color: inherit; text-decoration: none;
      transition: transform .15s ease, border-color .15s ease;
    }
    .card:hover, .card:focus-visible { transform: translateY(-2px); border-color: var(--accent); outline: none; }
    .card .icon { font-size: 2rem; line-height: 1; }
    .card h2 { margin: 0; font-size: 1.15rem; }
    .card p { margin: 0; color: var(--muted); font-size: .95rem; flex: 1; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { font-size: .75rem; padding: 2px 8px; border-radius: 999px; background: var(--bg); border: 1px solid var(--border); color: var(--muted); }
    .open { font-size: .9rem; color: var(--accent); font-weight: 600; }
    .empty {
      text-align: center; padding: 48px 20px; color: var(--muted);
      border: 2px dashed var(--border); border-radius: 14px;
    }
    .empty-icon { font-size: 3rem; margin-bottom: 16px; opacity: 0.5; }
    .loading {
      text-align: center; padding: 48px 20px; color: var(--muted);
    }
    .spinner {
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    footer { text-align: center; color: var(--muted); font-size: .85rem; padding: 24px; }
    .mascot-container {
      display: flex; justify-content: center; padding: 24px 20px;
    }
    .mascot-logo {
      width: 100%; max-width: 280px; height: auto;
      cursor: default;
    }
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5); align-items: center; justify-content: center;
      z-index: 1000;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: var(--card); padding: 32px; border-radius: 16px;
      max-width: 400px; width: 90%; box-shadow: var(--shadow);
    }
    .modal-content h2 { margin: 0 0 16px; }
    .modal-content p { margin: 0 0 24px; color: var(--muted); }
    .modal-actions { display: flex; gap: 12px; justify-content: flex-end; }
  </style>
</head>
<body>
  <header>
    <h1>smkn apps</h1>
    <p>作成したアプリの一覧です</p>
    <div class="header-actions">
      <div class="user-info">
        <div class="user-avatar" id="avatar"></div>
        <span id="username">読み込み中...</span>
      </div>
      <button class="btn" id="add-device-btn">🔐 デバイスを追加</button>
      <button class="btn" id="logout-btn">ログアウト</button>
    </div>
  </header>

  <script>
    // Eye tracking animation
    (function() {
      const mascot = document.getElementById('mascot');
      if (!mascot) {
        console.warn('Mascot SVG not found');
        return;
      }
      
      const eyeGroup = mascot.querySelector('.eyeGroup .eye');
      if (!eyeGroup) {
        console.warn('Eye group not found');
        return;
      }
      
      // Check for reduced motion preference
      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const lerpFactor = prefersReducedMotion ? 0.9 : 0.15; // Snap faster if reduced motion
      const restLerpFactor = prefersReducedMotion ? 0.9 : 0.1;
      
      let centerX = 0;
      let centerY = 0;
      let isInitialized = false;
      let targetAngle = 0;
      let currentAngle = 0;
      let isPointerInWindow = false;
      let isTouchDown = false; // Track if touch is currently pressed
      let animationFrameId = null;
      
      // Initialize eye center lazily (after SVG is fully rendered)
      function initEyeCenter() {
        if (isInitialized) return true;
        
        try {
          const eyeBBox = eyeGroup.getBBox();
          if (eyeBBox.width === 0 || eyeBBox.height === 0) {
            console.warn('Eye bbox not ready, retrying...');
            return false;
          }
          centerX = eyeBBox.x + eyeBBox.width / 2;
          centerY = eyeBBox.y + eyeBBox.height / 2;
          isInitialized = true;
          console.log('Eye tracking initialized', { centerX, centerY });
          return true;
        } catch (error) {
          console.error('Failed to get eye bbox:', error);
          return false;
        }
      }
      
      // Shortest angle difference for smooth rotation
      function angleDiff(a, b) {
        const diff = ((b - a + 180) % 360) - 180;
        return diff < -180 ? diff + 360 : diff;
      }
      
      // Linear interpolation
      function lerp(start, end, t) {
        return start + angleDiff(start, end) * t;
      }
      
      // Update eye rotation based on pointer position
      function updateEyePosition(clientX, clientY) {
        if (!isInitialized && !initEyeCenter()) return;
        
        try {
          // Convert screen coordinates to SVG coordinates
          const point = mascot.createSVGPoint();
          point.x = clientX;
          point.y = clientY;
          
          const ctm = mascot.getScreenCTM();
          if (!ctm) {
            console.warn('getScreenCTM returned null');
            return;
          }
          
          const svgPoint = point.matrixTransform(ctm.inverse());
          
          // Calculate angle from eye center to pointer
          const dx = svgPoint.x - centerX;
          const dy = svgPoint.y - centerY;
          targetAngle = Math.atan2(dy, dx) * (180 / Math.PI);
        } catch (error) {
          console.error('Error in updateEyePosition:', error);
        }
      }
      
      // Animation loop with smooth interpolation
      function animate() {
        if (!isInitialized && !initEyeCenter()) {
          animationFrameId = requestAnimationFrame(animate);
          return;
        }
        
        try {
          // Track if: (mouse hover on desktop) OR (touch is actively pressed)
          const shouldTrack = isPointerInWindow || isTouchDown;
          
          if (shouldTrack) {
            // Smooth lerp with dynamic factor based on reduced motion
            currentAngle = lerp(currentAngle, targetAngle, lerpFactor);
          } else {
            // Return to rest (0 degrees)
            currentAngle = lerp(currentAngle, 0, restLerpFactor);
          }
          
          // Apply rotation transform
          eyeGroup.setAttribute('transform', `rotate(${currentAngle}, ${centerX}, ${centerY})`);
        } catch (error) {
          console.error('Error in animate:', error);
        }
        
        animationFrameId = requestAnimationFrame(animate);
      }
      
      // Event handlers
      function handlePointerDown(e) {
        if (e.pointerType === 'touch') {
          isTouchDown = true;
          updateEyePosition(e.clientX, e.clientY);
        }
      }

      function handlePointerMove(e) {
        if (e.pointerType === 'touch') {
          // Touch: only track while pressed
          if (isTouchDown) {
            updateEyePosition(e.clientX, e.clientY);
          }
        } else {
          // Mouse: track on hover (existing behavior)
          isPointerInWindow = true;
          updateEyePosition(e.clientX, e.clientY);
        }
      }

      function handlePointerUp(e) {
        if (e.pointerType === 'touch') {
          isTouchDown = false;
        }
      }

      function handlePointerCancel(e) {
        if (e.pointerType === 'touch') {
          isTouchDown = false;
        }
      }
      
      function handlePointerLeave(e) {
        // Only reset if pointer actually left the window (mouse only)
        if (!e.relatedTarget && !e.toElement) {
          isPointerInWindow = false;
        }
      }
      
      // Attach events to window/document with passive listeners
      window.addEventListener('pointerdown', handlePointerDown, { passive: true });
      window.addEventListener('pointermove', handlePointerMove, { passive: true });
      window.addEventListener('pointerup', handlePointerUp, { passive: true });
      window.addEventListener('pointercancel', handlePointerCancel, { passive: true });
      
      // Use mouseout on document to detect when mouse leaves viewport
      document.addEventListener('mouseout', handlePointerLeave, { passive: true });
      
      window.addEventListener('blur', () => {
        isPointerInWindow = false;
      });
      
      // Try to initialize immediately
      setTimeout(initEyeCenter, 100);
      
      // Start animation loop
      animate();
      
      // Cleanup on page unload
      window.addEventListener('beforeunload', () => {
        if (animationFrameId) {
          cancelAnimationFrame(animationFrameId);
        }
      });
    })();
  </script>
  
  <main>
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <div>アプリを読み込んでいます...</div>
    </div>
    <div id="apps" class="grid" aria-live="polite" hidden></div>
    <div id="empty" class="empty" hidden>
      <div class="empty-icon">📦</div>
      <h2>アプリは準備中です</h2>
      <p>まだアプリが登録されていません</p>
    </div>
  </main>
  <footer>&copy; <span id="year"></span> smkn</footer>

  <div id="add-device-modal" class="modal">
    <div class="modal-content">
      <h2>デバイスを追加</h2>
      <p id="modal-message">新しいデバイスでパスキーを登録します</p>
      <div class="modal-actions">
        <button class="btn" id="modal-cancel">キャンセル</button>
        <button class="btn btn-primary" id="modal-confirm">登録する</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { startRegistration } from 'https://unpkg.com/@simplewebauthn/browser@11.0.0/dist/bundle/index.js';

    document.getElementById("year").textContent = new Date().getFullYear();

    const addDeviceBtn = document.getElementById('add-device-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const modal = document.getElementById('add-device-modal');
    const modalCancel = document.getElementById('modal-cancel');
    const modalConfirm = document.getElementById('modal-confirm');
    const modalMessage = document.getElementById('modal-message');

    function el(tag, className, text) {
      const e = document.createElement(tag);
      if (className) e.className = className;
      if (text != null) e.textContent = text;
      return e;
    }

    function renderApps(apps) {
      const list = document.getElementById("apps");
      const empty = document.getElementById("empty");
      const loading = document.getElementById("loading");
      
      loading.hidden = true;
      list.replaceChildren();
      
      if (!Array.isArray(apps) || apps.length === 0) {
        empty.hidden = false;
        list.hidden = true;
        return;
      }
      
      empty.hidden = true;
      list.hidden = false;
      
      for (const app of apps) {
        if (!app || !app.name || !app.url) continue;
        const card = el("a", "card");
        card.href = app.url;
        if (/^https?:\/\//.test(app.url) && !app.url.startsWith(location.origin)) {
          card.target = "_blank"; card.rel = "noopener";
        }
        card.append(el("div", "icon", app.icon || "📦"));
        card.append(el("h2", null, app.name));
        card.append(el("p", null, app.description || ""));
        if (Array.isArray(app.tags) && app.tags.length) {
          const tags = el("div", "tags");
          app.tags.forEach(t => tags.append(el("span", "tag", t)));
          card.append(tags);
        }
        card.append(el("span", "open", "開く →"));
        list.append(card);
      }
      
      if (!list.children.length) {
        empty.hidden = false;
        list.hidden = true;
      }
    }

    // Check authentication
    async function checkAuth() {
      try {
        const res = await fetch('/api/me', {
          credentials: 'include',
        });

        if (!res.ok || res.status === 401) {
          window.location.href = '/login.html';
          return;
        }

        const data = await res.json();
        if (!data.authenticated) {
          window.location.href = '/login.html';
          return;
        }

        // Display user info
        document.getElementById('username').textContent = data.username;
        const avatarEl = document.getElementById('avatar');
        avatarEl.textContent = data.username.charAt(0).toUpperCase();

        // Load apps
        fetch("apps.json", { cache: "no-store" })
          .then(r => r.ok ? r.json() : [])
          .then(renderApps)
          .catch(() => renderApps([]));

      } catch (error) {
        console.error('Auth check error:', error);
        window.location.href = '/login.html';
      }
    }

    // Logout
    logoutBtn.addEventListener('click', async () => {
      try {
        await fetch('/api/logout', {
          method: 'POST',
          credentials: 'include',
        });
        window.location.href = '/';
      } catch (error) {
        console.error('Logout error:', error);
        window.location.href = '/';
      }
    });

    // Add device modal
    addDeviceBtn.addEventListener('click', () => {
      modal.classList.add('active');
    });

    modalCancel.addEventListener('click', () => {
      modal.classList.remove('active');
      modalMessage.textContent = '新しいデバイスでパスキーを登録します';
      modalConfirm.disabled = false;
    });

    modalConfirm.addEventListener('click', async () => {
      modalConfirm.disabled = true;
      modalMessage.textContent = '処理中...';

      try {
        // Step 1: Get registration options
        const optionsRes = await fetch('/api/add-device/options', {
          method: 'POST',
          credentials: 'include',
        });

        if (!optionsRes.ok) {
          const error = await optionsRes.json();
          throw new Error(error.error || 'オプションの取得に失敗しました');
        }

        const { options } = await optionsRes.json();

        // Step 2: Start WebAuthn registration
        modalMessage.textContent = 'デバイスで認証情報を登録してください...';
        const registrationResponse = await startRegistration({ optionsJSON: options });

        // Step 3: Verify registration
        const verifyRes = await fetch('/api/add-device/verify', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ response: registrationResponse }),
        });

        if (!verifyRes.ok) {
          const error = await verifyRes.json();
          throw new Error(error.error || '検証に失敗しました');
        }

        const result = await verifyRes.json();
        if (result.verified) {
          modalMessage.textContent = 'デバイスが追加されました！';
          setTimeout(() => {
            modal.classList.remove('active');
            modalMessage.textContent = '新しいデバイスでパスキーを登録します';
            modalConfirm.disabled = false;
          }, 2000);
        } else {
          throw new Error('検証に失敗しました');
        }
      } catch (error) {
        console.error('Add device error:', error);
        modalMessage.textContent = 'エラー: ' + error.message;
        modalConfirm.disabled = false;
      }
    });

    checkAuth();
  </script>
