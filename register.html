<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>新規登録 - smkn apps</title>
  <style>
    :root {
      --bg: #f6f7fb; --card: #ffffff; --text: #1f2330; --muted: #6b7180;
      --accent: #3b6cf6; --border: #e3e6ee; --shadow: 0 2px 10px rgba(20, 30, 60, .06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12141a; --card: #1b1e27; --text: #e8eaf0; --muted: #9aa1b2;
        --accent: #7c9cff; --border: #2a2f3c; --shadow: 0 2px 10px rgba(0, 0, 0, .3);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
      line-height: 1.6; display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 20px;
    }
    .container {
      width: 100%; max-width: 420px; background: var(--card);
      border: 1px solid var(--border); border-radius: 16px;
      box-shadow: var(--shadow); padding: 40px 32px;
    }
    h1 {
      margin: 0 0 8px; font-size: 1.8rem; text-align: center;
    }
    .subtitle {
      text-align: center; color: var(--muted); margin: 0 0 32px; font-size: 0.95rem;
    }
    label {
      display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.9rem;
    }
    input {
      width: 100%; padding: 12px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--bg);
      color: var(--text); font-size: 1rem; margin-bottom: 16px;
    }
    input:focus {
      outline: none; border-color: var(--accent);
    }
    .btn {
      width: 100%; padding: 16px; border-radius: 8px; border: none;
      background: var(--accent); color: white; cursor: pointer;
      font-size: 1rem; font-weight: 600; transition: opacity 0.15s ease;
    }
    .btn:hover:not(:disabled) { opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .error {
      background: #fee; border: 1px solid #fcc;
      color: #c33; padding: 12px 16px; border-radius: 8px;
      margin-bottom: 16px; font-size: 0.9rem;
    }
    .info {
      background: #e8f4fd; border: 1px solid #b3d9f2;
      color: #1a5490; padding: 12px 16px; border-radius: 8px;
      margin-bottom: 16px; font-size: 0.9rem;
    }
    footer {
      text-align: center; color: var(--muted); font-size: 0.85rem;
      margin-top: 24px;
    }
    footer a {
      color: var(--accent); text-decoration: none;
    }
    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>新規登録</h1>
    <p class="subtitle">パスキーを登録してログインできるようにします</p>
    <div id="error" class="error" hidden></div>
    <div id="info" class="info" hidden></div>
    <form id="register-form">
      <label for="username">ユーザー名</label>
      <input type="text" id="username" name="username" required autofocus
             placeholder="例: smkn" autocomplete="username webauthn">
      
      <label for="setup-code">セットアップコード</label>
      <input type="password" id="setup-code" name="setupCode" required
             placeholder="管理者から提供されたコード" autocomplete="off">
      
      <button type="submit" class="btn">🔐 パスキーを登録</button>
    </form>
    <footer>
      <a href="/login.html">← ログインに戻る</a>
    </footer>
  </div>

  <script type="module">
    import { startRegistration } from 'https://unpkg.com/@simplewebauthn/browser@11.0.0/dist/bundle/index.js';

    const errorDiv = document.getElementById('error');
    const infoDiv = document.getElementById('info');
    const form = document.getElementById('register-form');
    const submitBtn = form.querySelector('button[type="submit"]');

    function showError(message) {
      errorDiv.textContent = message;
      errorDiv.hidden = false;
      infoDiv.hidden = true;
    }

    function showInfo(message) {
      infoDiv.textContent = message;
      infoDiv.hidden = false;
      errorDiv.hidden = true;
    }

    function hideMessages() {
      errorDiv.hidden = true;
      infoDiv.hidden = true;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMessages();
      submitBtn.disabled = true;
      submitBtn.textContent = '登録中...';

      try {
        const username = form.username.value.trim();
        const setupCode = form['setup-code'].value.trim();

        if (!username || !setupCode) {
          throw new Error('すべての項目を入力してください');
        }

        // Step 1: Get registration options
        const optionsRes = await fetch('/api/register/options', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, setupCode }),
        });

        if (!optionsRes.ok) {
          const error = await optionsRes.json();
          throw new Error(error.error || '登録オプションの取得に失敗しました');
        }

        const { options, userId } = await optionsRes.json();

        // Step 2: Start WebAuthn registration
        showInfo('デバイスで認証情報を登録してください...');
        const registrationResponse = await startRegistration({ optionsJSON: options });

        // Step 3: Verify registration
        const verifyRes = await fetch('/api/register/verify', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            userId,
            username,
            response: registrationResponse,
          }),
        });

        if (!verifyRes.ok) {
          const error = await verifyRes.json();
          throw new Error(error.error || '登録の検証に失敗しました');
        }

        const result = await verifyRes.json();
        if (result.verified) {
          showInfo('登録が完了しました！リダイレクトしています...');
          setTimeout(() => {
            window.location.href = '/hub.html';
          }, 1000);
        } else {
          throw new Error('登録に失敗しました');
        }
      } catch (error) {
        console.error('Registration error:', error);
        showError(error.message || '登録に失敗しました');
        submitBtn.disabled = false;
        submitBtn.textContent = '🔐 パスキーを登録';
      }
    });
  </script>
</body>
</html>
