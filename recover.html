<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>パスキー復旧 - smkn apps</title>
  <style>
    :root {
      --bg: #f6f7fb; --card: #ffffff; --text: #1f2330; --muted: #6b7180;
      --accent: #3b6cf6; --border: #e3e6ee; --shadow: 0 2px 10px rgba(20, 30, 60, .06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12141a; --card: #1b1e27; --text: #e8eaf0; --muted: #9aa1b2;
        --accent: #7c9cff; --border: #2a2f3c; --shadow: 0 2px 10px rgba(0, 0, 0, .3);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
      line-height: 1.6; display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 20px;
    }
    .container {
      width: 100%; max-width: 420px; background: var(--card);
      border: 1px solid var(--border); border-radius: 16px;
      box-shadow: var(--shadow); padding: 40px 32px;
    }
    h1 {
      margin: 0 0 8px; font-size: 1.8rem; text-align: center;
    }
    .subtitle {
      text-align: center; color: var(--muted); margin: 0 0 32px; font-size: 0.95rem;
    }
    label {
      display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.9rem;
    }
    input {
      width: 100%; padding: 12px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--bg);
      color: var(--text); font-size: 1rem; margin-bottom: 16px;
    }
    input:focus {
      outline: none; border-color: var(--accent);
    }
    .code-input {
      font-size: 1.5rem; text-align: center; letter-spacing: 8px;
      font-weight: 600;
    }
    .btn {
      width: 100%; padding: 16px; border-radius: 8px; border: none;
      background: var(--accent); color: white; cursor: pointer;
      font-size: 1rem; font-weight: 600; transition: opacity 0.15s ease;
    }
    .btn:hover:not(:disabled) { opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary {
      background: var(--card); color: var(--text); border: 1px solid var(--border);
      margin-top: 12px;
    }
    .error {
      background: #fee; border: 1px solid #fcc;
      color: #c33; padding: 12px 16px; border-radius: 8px;
      margin-bottom: 16px; font-size: 0.9rem;
    }
    .info {
      background: #e8f4fd; border: 1px solid #b3d9f2;
      color: #1a5490; padding: 12px 16px; border-radius: 8px;
      margin-bottom: 16px; font-size: 0.9rem;
    }
    .step {
      display: none;
    }
    .step.active {
      display: block;
    }
    footer {
      text-align: center; color: var(--muted); font-size: 0.85rem;
      margin-top: 24px;
    }
    footer a {
      color: var(--accent); text-decoration: none;
    }
    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>パスキー復旧</h1>
    <p class="subtitle">登録済みのメールアドレスで新しいパスキーを追加します</p>
    <div id="error" class="error" hidden></div>
    <div id="info" class="info" hidden></div>

    <!-- Step 1: Email -->
    <div id="step1" class="step active">
      <form id="email-form">
        <label for="email">メールアドレス</label>
        <input type="email" id="email" name="email" required autofocus
               placeholder="登録済みのメールアドレス" autocomplete="email">
        
        <button type="submit" class="btn">認証コードを送信</button>
      </form>
    </div>

    <!-- Step 2: Verify Code -->
    <div id="step2" class="step">
      <p style="text-align: center; color: var(--muted); font-size: 0.9rem;">
        <strong id="sent-email"></strong> にコードを送信しました
      </p>
      <form id="code-form">
        <label for="code">6桁の認証コード</label>
        <input type="text" id="code" name="code" required
               placeholder="000000" autocomplete="one-time-code"
               class="code-input" maxlength="6" pattern="[0-9]{6}">
        
        <button type="submit" class="btn">コードを確認</button>
        <button type="button" class="btn btn-secondary" id="resend-btn">コードを再送信</button>
      </form>
    </div>

    <!-- Step 3: Register New Passkey -->
    <div id="step3" class="step">
      <p style="text-align: center; color: var(--muted); font-size: 0.9rem;">
        メール認証が完了しました！<br>
        新しいデバイスでパスキーを登録してください
      </p>
      <button class="btn" id="register-passkey-btn">🔐 新しいパスキーを登録</button>
    </div>

    <footer>
      <a href="/login.html">← ログインに戻る</a>
    </footer>
  </div>

  <script type="module">
    import { startRegistration } from 'https://unpkg.com/@simplewebauthn/browser@11.0.0/dist/bundle/index.js';

    const errorDiv = document.getElementById('error');
    const infoDiv = document.getElementById('info');
    const step1 = document.getElementById('step1');
    const step2 = document.getElementById('step2');
    const step3 = document.getElementById('step3');
    
    let currentEmail = '';
    let codeId = '';
    let userId = '';
    let options = null;

    function showError(message) {
      errorDiv.textContent = message;
      errorDiv.hidden = false;
      infoDiv.hidden = true;
    }

    function showInfo(message) {
      infoDiv.textContent = message;
      infoDiv.hidden = false;
      errorDiv.hidden = true;
    }

    function hideMessages() {
      errorDiv.hidden = true;
      infoDiv.hidden = true;
    }

    function goToStep(step) {
      step1.classList.remove('active');
      step2.classList.remove('active');
      step3.classList.remove('active');
      step.classList.add('active');
      hideMessages();
    }

    // Step 1: Send recovery code
    document.getElementById('email-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMessages();
      
      const submitBtn = e.target.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.textContent = '送信中...';

      try {
        currentEmail = document.getElementById('email').value.trim();

        const res = await fetch('/api/recover/send', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: currentEmail }),
        });

        if (!res.ok) {
          const error = await res.json();
          throw new Error(error.error || '送信に失敗しました');
        }

        const data = await res.json();
        if (data.codeId) {
          codeId = data.codeId;
        }
        
        document.getElementById('sent-email').textContent = currentEmail;
        goToStep(step2);
        document.getElementById('code').focus();
        
        // Show generic message for security
        showInfo(data.message || 'メールアドレスが登録されている場合、コードを送信しました');
      } catch (error) {
        console.error('Send error:', error);
        showError(error.message || 'コードの送信に失敗しました');
        submitBtn.disabled = false;
        submitBtn.textContent = '認証コードを送信';
      }
    });

    // Step 2: Verify code
    document.getElementById('code-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMessages();
      
      const submitBtn = e.target.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.textContent = '確認中...';

      try {
        const code = document.getElementById('code').value.trim();

        if (!codeId) {
          throw new Error('コードが見つかりません。最初からやり直してください');
        }

        const res = await fetch('/api/recover/verify', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ codeId, code }),
        });

        if (!res.ok) {
          const error = await res.json();
          throw new Error(error.error || '確認に失敗しました');
        }

        const data = await res.json();
        userId = data.userId;
        options = data.options;
        
        goToStep(step3);
      } catch (error) {
        console.error('Verify error:', error);
        showError(error.message || 'コードの確認に失敗しました');
        submitBtn.disabled = false;
        submitBtn.textContent = 'コードを確認';
      }
    });

    // Resend code
    document.getElementById('resend-btn').addEventListener('click', async () => {
      hideMessages();
      const btn = document.getElementById('resend-btn');
      btn.disabled = true;
      btn.textContent = '送信中...';

      try {
        const res = await fetch('/api/recover/send', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: currentEmail }),
        });

        if (!res.ok) {
          const error = await res.json();
          throw new Error(error.error || '再送信に失敗しました');
        }

        const data = await res.json();
        if (data.codeId) {
          codeId = data.codeId;
        }
        
        showInfo('新しいコードを送信しました');
      } catch (error) {
        console.error('Resend error:', error);
        showError(error.message || 'コードの再送信に失敗しました');
      } finally {
        btn.disabled = false;
        btn.textContent = 'コードを再送信';
      }
    });

    // Step 3: Register new passkey
    document.getElementById('register-passkey-btn').addEventListener('click', async () => {
      hideMessages();
      const btn = document.getElementById('register-passkey-btn');
      btn.disabled = true;
      btn.textContent = '処理中...';

      try {
        // Start WebAuthn registration
        showInfo('デバイスで認証情報を登録してください...');
        const registrationResponse = await startRegistration({ optionsJSON: options });

        // Verify registration (using add-device endpoint)
        const verifyRes = await fetch('/api/add-device/verify', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ response: registrationResponse }),
        });

        if (!verifyRes.ok) {
          const error = await verifyRes.json();
          throw new Error(error.error || '登録の検証に失敗しました');
        }

        const result = await verifyRes.json();
        if (result.verified) {
          showInfo('新しいパスキーが登録されました！ログインページに移動します...');
          setTimeout(() => {
            window.location.href = '/login.html';
          }, 2000);
        } else {
          throw new Error('登録に失敗しました');
        }
      } catch (error) {
        console.error('Registration error:', error);
        showError(error.message || 'パスキーの登録に失敗しました');
        btn.disabled = false;
        btn.textContent = '🔐 新しいパスキーを登録';
      }
    });
  </script>
</body>
</html>
