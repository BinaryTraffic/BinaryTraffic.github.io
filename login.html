<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ログイン - smkn apps</title>
  <style>
    :root {
      --bg: #f6f7fb; --card: #ffffff; --text: #1f2330; --muted: #6b7180;
      --accent: #3b6cf6; --border: #e3e6ee; --shadow: 0 2px 10px rgba(20, 30, 60, .06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12141a; --card: #1b1e27; --text: #e8eaf0; --muted: #9aa1b2;
        --accent: #7c9cff; --border: #2a2f3c; --shadow: 0 2px 10px rgba(0, 0, 0, .3);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
      line-height: 1.6; display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 20px;
    }
    .container {
      width: 100%; max-width: 420px; background: var(--card);
      border: 1px solid var(--border); border-radius: 16px;
      box-shadow: var(--shadow); padding: 40px 32px;
    }
    h1 {
      margin: 0 0 8px; font-size: 1.8rem; text-align: center;
    }
    .subtitle {
      text-align: center; color: var(--muted); margin: 0 0 32px; font-size: 0.95rem;
    }
    .btn {
      width: 100%; padding: 16px; border-radius: 8px; border: none;
      background: var(--accent); color: white; cursor: pointer;
      font-size: 1rem; font-weight: 600; transition: opacity 0.15s ease;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn:hover:not(:disabled) { opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .error {
      background: #fee; border: 1px solid #fcc;
      color: #c33; padding: 12px 16px; border-radius: 8px;
      margin-bottom: 16px; font-size: 0.9rem;
    }
    .info {
      background: #e8f4fd; border: 1px solid #b3d9f2;
      color: #1a5490; padding: 12px 16px; border-radius: 8px;
      margin-bottom: 16px; font-size: 0.9rem;
    }
    footer {
      text-align: center; color: var(--muted); font-size: 0.85rem;
      margin-top: 24px;
    }
    footer a {
      color: var(--accent); text-decoration: none;
    }
    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>ログイン</h1>
    <p class="subtitle">smkn apps へようこそ</p>
    <div id="error" class="error" hidden></div>
    <div id="info" class="info" hidden></div>
    <button id="login-btn" class="btn">
      🔐 生体認証でログイン
    </button>
    <footer>
      <a href="/">← ホームに戻る</a>
      <span style="margin: 0 8px; color: var(--border);">|</span>
      <a href="/register.html">新規登録</a>
    </footer>
  </div>

  <script type="module">
    import { startAuthentication } from 'https://unpkg.com/@simplewebauthn/browser@11.0.0/dist/bundle/index.js';

    const errorDiv = document.getElementById('error');
    const infoDiv = document.getElementById('info');
    const loginBtn = document.getElementById('login-btn');

    function showError(message) {
      errorDiv.textContent = message;
      errorDiv.hidden = false;
      infoDiv.hidden = true;
    }

    function showInfo(message) {
      infoDiv.textContent = message;
      infoDiv.hidden = false;
      errorDiv.hidden = true;
    }

    function hideMessages() {
      errorDiv.hidden = true;
      infoDiv.hidden = true;
    }

    loginBtn.addEventListener('click', async () => {
      hideMessages();
      loginBtn.disabled = true;
      loginBtn.textContent = 'ログイン中...';

      try {
        // Step 1: Get authentication options
        const optionsRes = await fetch('/api/login/options', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
        });

        if (!optionsRes.ok) {
          const error = await optionsRes.json();
          throw new Error(error.error || 'ログインオプションの取得に失敗しました');
        }

        const { options } = await optionsRes.json();

        // Step 2: Start WebAuthn authentication
        showInfo('デバイスで認証してください...');
        const authResponse = await startAuthentication({ optionsJSON: options });

        // Step 3: Verify authentication
        const verifyRes = await fetch('/api/login/verify', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ response: authResponse }),
        });

        if (!verifyRes.ok) {
          const error = await verifyRes.json();
          throw new Error(error.error || 'ログインの検証に失敗しました');
        }

        const result = await verifyRes.json();
        if (result.verified) {
          window.location.href = '/hub.html';
        } else {
          throw new Error('認証に失敗しました');
        }
      } catch (error) {
        console.error('Login error:', error);
        showError(error.message || 'ログインに失敗しました');
        loginBtn.disabled = false;
        loginBtn.innerHTML = '🔐 生体認証でログイン';
      }
    });
  </script>
</body>
</html>
