<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ログイン - smkn apps</title>
  <style>
    :root {
      --bg: #f6f7fb; --card: #ffffff; --text: #1f2330; --muted: #6b7180;
      --accent: #3b6cf6; --border: #e3e6ee; --shadow: 0 2px 10px rgba(20, 30, 60, .06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12141a; --card: #1b1e27; --text: #e8eaf0; --muted: #9aa1b2;
        --accent: #7c9cff; --border: #2a2f3c; --shadow: 0 2px 10px rgba(0, 0, 0, .3);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
      line-height: 1.6; display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 20px;
    }
    .container {
      width: 100%; max-width: 420px; background: var(--card);
      border: 1px solid var(--border); border-radius: 16px;
      box-shadow: var(--shadow); padding: 40px 32px;
    }
    h1 {
      margin: 0 0 8px; font-size: 1.8rem; text-align: center;
    }
    .subtitle {
      text-align: center; color: var(--muted); margin: 0 0 32px; font-size: 0.95rem;
    }
    .auth-container {
      min-height: 400px; display: flex; align-items: center; justify-content: center;
    }
    .loading {
      text-align: center; color: var(--muted);
    }
    .spinner {
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .error {
      background: #fee; border: 1px solid #fcc;
      color: #c33; padding: 12px 16px; border-radius: 8px;
      margin-bottom: 16px; font-size: 0.9rem;
    }
    footer {
      text-align: center; color: var(--muted); font-size: 0.85rem;
      margin-top: 24px;
    }
    footer a {
      color: var(--accent); text-decoration: none;
    }
    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>ログイン</h1>
    <p class="subtitle">smkn apps へようこそ</p>
    <div id="error" class="error" hidden></div>
    <div id="auth" class="auth-container">
      <div class="loading">
        <div class="spinner"></div>
        <div>認証システムを読み込んでいます...</div>
      </div>
    </div>
    <footer>
      <a href="/">← ホームに戻る</a>
    </footer>
  </div>

  <script src="config.js"></script>
  <script>
    const errorDiv = document.getElementById('error');

    function showError(message) {
      errorDiv.textContent = message;
      errorDiv.hidden = false;
    }

    // config.js の確認
    if (!window.CLERK_CONFIG || window.CLERK_CONFIG.publishableKey === 'YOUR_PUBLISHABLE_KEY_HERE') {
      showError('認証設定が完了していません。config.js を確認してください。');
    } else {
      // Clerk SDK を動的に読み込み
      const script = document.createElement('script');
      script.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js';
      script.async = true;
      script.crossOrigin = 'anonymous';
      
      const clerkScript = document.createElement('script');
      clerkScript.src = 'https://accounts.app.clerk.com/npm/@clerk/clerk-js@latest/dist/clerk.browser.js';
      clerkScript.async = true;
      clerkScript.crossOrigin = 'anonymous';
      
      clerkScript.onload = async () => {
        try {
          const clerk = window.Clerk;
          await clerk.load({
            publishableKey: window.CLERK_CONFIG.publishableKey,
            localization: {
              locale: 'ja-JP'
            }
          });

          // すでにログイン済みの場合はリダイレクト
          if (clerk.user) {
            window.location.href = '/hub.html';
            return;
          }

          // Clerk の SignIn コンポーネントをマウント
          const authDiv = document.getElementById('auth');
          authDiv.innerHTML = '';
          
          clerk.mountSignIn(authDiv, {
            appearance: {
              layout: {
                socialButtonsVariant: 'iconButton',
                shimmer: true
              },
              variables: {
                colorPrimary: '#3b6cf6',
                colorBackground: 'var(--card)',
                colorText: 'var(--text)',
                colorInputBackground: 'var(--bg)',
                colorInputText: 'var(--text)',
                borderRadius: '8px'
              }
            },
            signUpUrl: '/signup.html',
            afterSignInUrl: '/hub.html'
          });

        } catch (err) {
          console.error('Clerk initialization error:', err);
          showError('認証システムの初期化に失敗しました: ' + err.message);
        }
      };

      clerkScript.onerror = () => {
        showError('認証システムの読み込みに失敗しました。ネットワーク接続を確認してください。');
      };

      document.head.appendChild(clerkScript);
    }
  </script>
</body>
</html>
